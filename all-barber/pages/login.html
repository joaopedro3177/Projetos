<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Login</title>
</head>
<body>
    
    <div class="container">
        <h2>Login</h2>
        <hr>

        <form action="#" class="login" method="post">
            <div class="md-3">
                <label for="SeuEmail">Seu email</label>
                <br>
                <input type="text" class="email" placeholder="Digite seu email">
            </div>

            <br>

            <div class="md-3">
                <label for="SeuSenha">Sua senha</label>
                <br>
                <input type="text" class="senha" placeholder="Digite sua senha">
            </div>

            <br>

            <input type="checkbox" class="manterLogado">
            <label for="ManterLogado">Manter-me logado</label>
            <br>
            <div class="botao">
                <button type="submit" class="entrar">Entrar</button>
            </div>
        </form>



        <div class="fundo-cinza">

            <p>Ainda não tem conta?</p>
            <button>Cadastra-se</button>
        </div>

    </div>


</body>
</html>
